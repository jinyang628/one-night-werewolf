name: CI checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  file-changes:
    name: Check location of file changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-CI:
    needs: file-changes
    if: ${{ needs.file-changes.outputs.backend == 'true' }}
    name: backend-CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.1
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.1'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry install --no-interaction --no-root

      - name: Run isort
        working-directory: ./backend
        run: |
          poetry run isort --check-only --diff .

      - name: Run autoflake
        working-directory: ./backend
        run: |
          poetry run autoflake --remove-all-unused-imports --in-place --recursive --check --exclude=__init__.py --ignore-pass-after-docstring .

      - name: Run black
        working-directory: ./backend
        run: |
          poetry run black --check --diff .

  frontend-CI:
    needs: file-changes
    if: ${{ needs.file-changes.outputs.frontend == 'true' }}
    name: frontend-CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Create test environment file
        working-directory: ./frontend
        run: cp .env.example .env

      - name: Check Dart formatting
        working-directory: ./frontend
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyzer
        working-directory: ./frontend
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: ./frontend
        run: flutter test
